<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Create Account — {{ app_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:#f4f4f4;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;}
    .card{background:white;border:1px solid #e0e0e0;border-radius:10px;width:100%;max-width:460px;overflow:hidden;}
    .card-header{background:#161616;padding:2rem;text-align:center;}
    .card-header h1{color:white;font-size:1.3rem;font-weight:700;margin-top:.75rem;}
    .card-header p{color:#a8a8a8;font-size:.82rem;margin-top:4px;}
    .logo{display:inline-flex;align-items:center;gap:8px;color:white;text-decoration:none;font-weight:700;font-size:.9rem;}
    .ibm-pill{background:#0f62fe;font-size:.6rem;font-weight:800;padding:2px 6px;border-radius:3px;letter-spacing:.07em;}
    .card-body{padding:2rem;}
    .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;}
    .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:.85rem;}
    .fg.full{grid-column:1/-1;}
    label{font-size:.75rem;font-weight:700;color:#525252;text-transform:uppercase;letter-spacing:.04em;}
    input,select{border:1px solid #e0e0e0;border-radius:5px;padding:.65rem .85rem;font-size:.875rem;font-family:inherit;width:100%;transition:border-color .15s;}
    input:focus,select:focus{outline:none;border-color:#0f62fe;box-shadow:0 0 0 3px rgba(15,98,254,.12);}
    .req{color:#da1e28;}
    .btn{width:100%;padding:.75rem;background:#0f62fe;color:white;border:none;border-radius:5px;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .15s;margin-top:.5rem;}
    .btn:hover{background:#0043ce;}
    .btn:disabled{background:#8d8d8d;cursor:not-allowed;}
    .link-row{text-align:center;font-size:.85rem;color:#525252;margin-top:1rem;}
    .link-row a{color:#0f62fe;text-decoration:none;font-weight:600;}
    #msg{display:none;padding:.75rem 1rem;border-radius:5px;font-size:.85rem;margin-bottom:1rem;}
    .msg-error{background:#fff1f1;color:#a2191f;border-left:4px solid #da1e28;}
    .msg-success{background:#defbe6;color:#0e6027;border-left:4px solid #198038;}
    .pwd-hint{font-size:.75rem;color:#8d8d8d;margin-top:3px;}
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <a href="/" class="logo">
      <svg width="22" height="22" viewBox="0 0 28 28" fill="none"><path d="M14 3L25 8.5V19.5L14 25L3 19.5V8.5L14 3Z" stroke="#74b1ff" stroke-width="1.5" fill="rgba(15,98,254,0.15)"/><path d="M7 13L14 10L21 13M14 10V21" stroke="#74b1ff" stroke-width="1.5" stroke-linecap="round"/></svg>
      IBM Travel Planner <span class="ibm-pill">AI</span>
    </a>
    <h1>Create Your Account</h1>
    <p>Start planning trips with IBM Granite AI</p>
  </div>
  <div class="card-body">
    <div id="msg"></div>
    <div class="fgrid">
      <div class="fg"><label>First Name</label><input id="first_name" type="text" placeholder="Priya"/></div>
      <div class="fg"><label>Last Name</label><input id="last_name" type="text" placeholder="Sharma"/></div>
      <div class="fg full"><label>Email <span class="req">*</span></label><input id="email" type="email" placeholder="you@email.com" autocomplete="email"/></div>
      <div class="fg full"><label>Username <span class="req">*</span></label><input id="username" type="text" placeholder="traveler_priya" autocomplete="username"/></div>
      <div class="fg full">
        <label>Password <span class="req">*</span></label>
        <input id="password" type="password" placeholder="Min 8 characters" autocomplete="new-password"/>
        <span class="pwd-hint">Must be at least 8 characters</span>
      </div>
      <div class="fg full"><label>Confirm Password <span class="req">*</span></label><input id="confirm_password" type="password" placeholder="Repeat password" autocomplete="new-password"/></div>
      <div class="fg"><label>Home City</label><input id="home_city" type="text" placeholder="Mumbai"/></div>
      <div class="fg"><label>Nationality</label><input id="nationality" type="text" placeholder="Indian"/></div>
    </div>
    <button class="btn" id="reg-btn" onclick="doRegister()">Create Account</button>
    <div class="link-row">Already have an account? <a href="/login">Sign in</a></div>
    <div class="link-row" style="margin-top:.5rem;"><a href="/">← Back to Home</a></div>
  </div>
</div>
<script>
async function doRegister() {
  const btn = document.getElementById('reg-btn');
  const msg = document.getElementById('msg');
  const email = document.getElementById('email').value.trim();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm_password').value;
  if (!email || !username || !password) { showMsg('Email, username and password are required.', 'error'); return; }
  if (password !== confirm) { showMsg('Passwords do not match.', 'error'); return; }
  if (password.length < 8) { showMsg('Password must be at least 8 characters.', 'error'); return; }
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const r = await fetch('/api/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({
        email, username, password,
        first_name: document.getElementById('first_name').value.trim(),
        last_name: document.getElementById('last_name').value.trim(),
        home_city: document.getElementById('home_city').value.trim(),
        nationality: document.getElementById('nationality').value.trim(),
      })
    });
    const d = await r.json();
    if (!r.ok) { showMsg(d.error || 'Registration failed', 'error'); btn.disabled=false; btn.textContent='Create Account'; return; }
    showMsg('Account created! Redirecting…', 'success');
    setTimeout(() => window.location.href = '/app', 1000);
  } catch(e) { showMsg('Network error. Try again.', 'error'); btn.disabled=false; btn.textContent='Create Account'; }
}
function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text; el.className = type==='error'?'msg-error':'msg-success';
  el.style.display='block';
}
</script>
</body></html>
