<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login — {{ app_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:#f4f4f4;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;}
    .card{background:white;border:1px solid #e0e0e0;border-radius:10px;width:100%;max-width:420px;overflow:hidden;}
    .card-header{background:#161616;padding:2rem;text-align:center;}
    .card-header h1{color:white;font-size:1.3rem;font-weight:700;margin-top:0.75rem;}
    .card-header p{color:#a8a8a8;font-size:0.82rem;margin-top:4px;}
    .logo{display:inline-flex;align-items:center;gap:8px;color:white;text-decoration:none;font-weight:700;font-size:0.9rem;}
    .ibm-pill{background:#0f62fe;font-size:0.6rem;font-weight:800;padding:2px 6px;border-radius:3px;letter-spacing:.07em;}
    .card-body{padding:2rem;}
    .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:1rem;}
    label{font-size:0.75rem;font-weight:700;color:#525252;text-transform:uppercase;letter-spacing:.04em;}
    input{border:1px solid #e0e0e0;border-radius:5px;padding:.65rem .85rem;font-size:.875rem;font-family:inherit;width:100%;transition:border-color .15s;}
    input:focus{outline:none;border-color:#0f62fe;box-shadow:0 0 0 3px rgba(15,98,254,.12);}
    .btn{width:100%;padding:.75rem;background:#0f62fe;color:white;border:none;border-radius:5px;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .15s;margin-top:.5rem;}
    .btn:hover{background:#0043ce;}
    .btn:disabled{background:#8d8d8d;cursor:not-allowed;}
    .divider{text-align:center;color:#8d8d8d;font-size:.8rem;margin:1rem 0;position:relative;}
    .divider::before,.divider::after{content:'';position:absolute;top:50%;width:43%;height:1px;background:#e0e0e0;}
    .divider::before{left:0}.divider::after{right:0}
    .link-row{text-align:center;font-size:.85rem;color:#525252;margin-top:1rem;}
    .link-row a{color:#0f62fe;text-decoration:none;font-weight:600;}
    #msg{display:none;padding:.75rem 1rem;border-radius:5px;font-size:.85rem;margin-bottom:1rem;}
    .msg-error{background:#fff1f1;color:#a2191f;border-left:4px solid #da1e28;}
    .msg-success{background:#defbe6;color:#0e6027;border-left:4px solid #198038;}
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <a href="/" class="logo">
      <svg width="22" height="22" viewBox="0 0 28 28" fill="none"><path d="M14 3L25 8.5V19.5L14 25L3 19.5V8.5L14 3Z" stroke="#74b1ff" stroke-width="1.5" fill="rgba(15,98,254,0.15)"/><path d="M7 13L14 10L21 13M14 10V21" stroke="#74b1ff" stroke-width="1.5" stroke-linecap="round"/></svg>
      IBM Travel Planner <span class="ibm-pill">AI</span>
    </a>
    <h1>Welcome Back</h1>
    <p>Sign in to access your travel plans</p>
  </div>
  <div class="card-body">
    <div id="msg"></div>
    <div class="fg"><label>Email or Username</label><input id="identifier" type="text" placeholder="you@email.com" autocomplete="username"/></div>
    <div class="fg"><label>Password</label><input id="password" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
    <button class="btn" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="divider">or</div>
    <a href="/app" style="display:block;text-align:center;padding:.7rem;border:1px solid #e0e0e0;border-radius:5px;color:#525252;text-decoration:none;font-size:.85rem;transition:all .15s;" onmouseover="this.style.background='#f4f4f4'" onmouseout="this.style.background='white'">
      Continue without account →
    </a>
    <div class="link-row">Don't have an account? <a href="/register">Sign up</a></div>
    <div class="link-row" style="margin-top:.5rem;"><a href="/">← Back to Home</a></div>
  </div>
</div>
<script>
async function doLogin() {
  const btn = document.getElementById('login-btn');
  const msg = document.getElementById('msg');
  const identifier = document.getElementById('identifier').value.trim();
  const password = document.getElementById('password').value;
  if (!identifier || !password) { showMsg('Please fill in all fields.', 'error'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify({email:identifier, username:identifier, password}) });
    const d = await r.json();
    if (!r.ok) { showMsg(d.error || 'Login failed', 'error'); btn.disabled=false; btn.textContent='Sign In'; return; }
    showMsg('Logged in! Redirecting…', 'success');
    setTimeout(() => window.location.href = '/app', 800);
  } catch(e) { showMsg('Network error. Try again.', 'error'); btn.disabled=false; btn.textContent='Sign In'; }
}
function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text; el.className = type==='error' ? 'msg-error' : 'msg-success';
  el.style.display = 'block';
}
document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
</body></html>
